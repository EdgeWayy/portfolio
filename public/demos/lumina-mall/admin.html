<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Lumina Mall · Admin</title>
  <meta name="theme-color" content="#1f2a4d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/theme-init.js"></script>
</head>
<body class="page-admin">
  <!-- ============================ LOGIN ============================ -->
  <main class="login" id="loginView" hidden>
    <div class="login-bg" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="login-lang" data-lang-switch></div>
    <form class="login-card glass" id="loginForm" novalidate autocomplete="off">
      <div class="login-icon" aria-hidden="true"><span data-icon="lock" data-size="26"></span></div>
      <h1 class="login-title" data-i18n="login.title"></h1>
      <p class="muted" data-i18n="login.sub"></p>
      <div class="field">
        <label class="label" for="password" data-i18n="login.password"></label>
        <div class="input-group">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required aria-describedby="loginMsg">
          <button class="icon-btn icon-btn-sm" type="button" id="togglePw" data-i18n-attr="aria-label:login.show" aria-pressed="false"><span data-icon="eye" data-size="18"></span></button>
        </div>
        <p class="error-msg" id="loginMsg" role="alert"></p>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn" data-i18n="login.submit"></button>
      <p class="login-note"><span data-icon="shield" data-size="16"></span><span data-i18n="login.note"></span></p>
      <a class="link-btn login-back" href="index.html" data-i18n="login.back"></a>
    </form>
  </main>

  <!-- ============================== APP ============================== -->
  <div class="admin" id="appView" hidden>
    <aside class="sidebar" id="sidebar" data-i18n-attr="aria-label:admin.nav">
      <a class="brand" href="index.html" data-i18n-attr="aria-label:nav.home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect class="bm-bg" x="1" y="1" width="38" height="38" rx="12"/>
          <path class="bm-arch" d="M12 30V20a8 8 0 0 1 16 0v10"/>
          <path class="bm-floor" d="M9 30h22"/>
          <circle class="bm-sun" cx="20" cy="10.5" r="2.6"/>
        </svg>
        <span class="brand-text"><span class="brand-name">Lumina</span><span class="brand-sub" data-i18n="admin.sub"></span></span>
      </a>
      <nav class="side-nav">
        <a href="#/dashboard" data-nav="dashboard"><span data-icon="dashboard" data-size="18"></span><span data-i18n="nav.dashboard"></span></a>
        <a href="#/stores" data-nav="stores"><span data-icon="store" data-size="18"></span><span data-i18n="nav.stores"></span></a>
        <a href="#/products" data-nav="products"><span data-icon="package" data-size="18"></span><span data-i18n="nav.products"></span></a>
        <a href="#/data" data-nav="data"><span data-icon="database" data-size="18"></span><span data-i18n="nav.data"></span></a>
      </nav>
      <div class="side-foot">
        <a class="side-link" href="index.html" target="_blank" rel="noopener"><span data-icon="external" data-size="16"></span><span data-i18n="admin.viewSite"></span></a>
        <span class="pill pill-trial" data-i18n="app.trial"></span>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <div class="admin-main">
      <header class="admin-top">
        <button class="icon-btn menu-btn" type="button" id="menuBtn" data-i18n-attr="aria-label:admin.menu" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
        <h1 class="admin-title" id="viewTitle"></h1>
        <div class="topbar-actions">
          <div data-lang-switch></div>
          <button class="icon-btn" type="button" data-theme-toggle></button>
          <button class="btn btn-ghost btn-sm" type="button" id="logoutBtn"><span data-icon="logout" data-size="16"></span><span class="hide-sm" data-i18n="admin.logout"></span></button>
        </div>
      </header>
      <main class="admin-view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/photos.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/imageStore.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/admin.js" defer></script>
<script src="../_shared/demo-bar.js" data-usta-demo-bar data-home="../../" data-name="Lumina Mall" data-note="admin: admin123" defer></script>
</body>
</html>
