<!doctype html>
<html lang="ru" class="no-js" data-page="contact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Контакт — Акбар</title>
  <meta name="description" content="Расскажите о задаче — Акбар ответит в Telegram. Сайты, магазины и боты для бизнеса в Узбекистане.">
  <meta property="og:title" content="Контакт — Акбар">
  <meta property="og:description" content="Расскажите о задаче — отвечу в Telegram.">
  <meta property="og:url" content="https://edgewayy.github.io/portfolio/contact.html">
  <link rel="canonical" href="https://edgewayy.github.io/portfolio/contact.html">
  <!-- @include head -->
</head>
<body>
  <!-- @include header -->

  <main id="main">
    <!-- ============ CONTACT ============ -->
    <section class="contact section section--blush" id="contact" aria-labelledby="contact-title">
      <div class="sec-head">
        <span class="sec-num mono">01</span>
        <h2 class="sec-title" id="contact-title" data-split data-i18n="contact.title">Расскажите о задаче — отвечу в Telegram</h2>
      </div>
      <div class="contact__grid">
        <form class="quote" id="quote" novalidate>
          <fieldset>
            <legend class="mono" data-i18n="contact.need">Что нужно</legend>
            <div class="chips" data-name="need">
              <label><input type="checkbox" value="site"><span data-i18n="contact.n1">Сайт-визитка</span></label>
              <label><input type="checkbox" value="shop"><span data-i18n="contact.n2">Интернет-магазин</span></label>
              <label><input type="checkbox" value="admin"><span data-i18n="contact.n3">Админ-панель</span></label>
              <label><input type="checkbox" value="pay"><span data-i18n="contact.n4">Оплата Click / Payme</span></label>
              <label><input type="checkbox" value="bot"><span data-i18n="contact.n5">Telegram-бот</span></label>
              <label><input type="checkbox" value="redesign"><span data-i18n="contact.n6">Редизайн</span></label>
              <label><input type="checkbox" value="booking"><span data-i18n="contact.n7">Онлайн-запись</span></label>
              <label><input type="checkbox" value="qr"><span data-i18n="contact.n8">QR-меню</span></label>
              <label><input type="checkbox" value="seo"><span data-i18n="contact.n9">SEO и карты</span></label>
              <label><input type="checkbox" value="support"><span data-i18n="contact.n10">Поддержка</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend class="mono" data-i18n="contact.budget">Бюджет</legend>
            <div class="chips" data-name="budget">
              <label><input type="radio" name="budget" value="b1"><span>&lt; $200</span></label>
              <label><input type="radio" name="budget" value="b2"><span>$200–500</span></label>
              <label><input type="radio" name="budget" value="b3"><span>$500–1000</span></label>
              <label><input type="radio" name="budget" value="b4"><span>$1000+</span></label>
              <label><input type="radio" name="budget" value="b5"><span data-i18n="contact.b5">Пока не знаю</span></label>
            </div>
          </fieldset>
          <div class="field">
            <label for="q-name" class="mono" data-i18n="contact.name">Имя и бизнес</label>
            <input id="q-name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Например: Дильноза, кофейня в Навои" data-i18n-ph="contact.namePh">
          </div>
          <div class="field">
            <label for="q-msg" class="mono" data-i18n="contact.msg">Пара слов о задаче</label>
            <textarea id="q-msg" name="msg" rows="3" maxlength="600" placeholder="Нужен сайт с меню и кнопкой заказа…" data-i18n-ph="contact.msgPh"></textarea>
          </div>
          <div class="quote__actions">
            <button class="btn btn--ink btn--lg magnetic" type="submit" data-cursor="Telegram">
              <svg class="tg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 3.6 2.9 10.8c-1.2.5-1.2 1.2 0 1.6l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.6-1.4zM9.6 14.4l-.4 4.1-1.4-4.6 10.6-6.7z"/></svg>
              <span data-i18n="contact.send">Отправить в Telegram</span>
            </button>
            <button class="btn btn--line-ink" type="button" id="q-copy" data-i18n="contact.copy">Скопировать текст</button>
          </div>
          <p class="quote__note" id="q-note" role="status" aria-live="polite" data-i18n="contact.note">Откроется чат с @KrieWoo с готовым сообщением. Ничего не отправляется без вас.</p>
        </form>
        <aside class="contact__aside">
          <p class="mono" data-i18n="contact.direct">Или напрямую</p>
          <a class="contact__tg magnetic" href="https://t.me/KrieWoo" target="_blank" rel="noopener" data-cursor="Open">@KrieWoo</a>
          <p data-i18n="contact.resp">Обычно отвечаю в тот же день. Пишите на русском, узбекском или английском.</p>
          <p class="mono" data-i18n="contact.links">Ссылки</p>
          <ul class="contact__links">
            <li><a href="https://t.me/KrieWoo" target="_blank" rel="noopener">Telegram <span>@KrieWoo ↗</span></a></li>
            <li><a href="https://github.com/EdgeWayy" target="_blank" rel="noopener">GitHub <span>EdgeWayy ↗</span></a></li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <!-- @include footer -->
</body>
</html>
