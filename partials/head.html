  <!-- critical: loader and no-js state, before the CSS bundle arrives -->
  <style>
    html{background:#0F1318;color:#ECE7DC}
    .loader{position:fixed;inset:0;z-index:100;background:#0F1318;color:#ECE7DC;display:grid;place-items:center}
    .no-js .loader,.loaded .loader{display:none}
    .loader__star{width:72px;height:72px}
    .loader__star path{fill:none;stroke:#C9A35E;stroke-width:1.2;stroke-dasharray:100;stroke-dashoffset:100}
    @media (prefers-reduced-motion:reduce){.loader__star path{animation:none;stroke-dashoffset:0}}
  </style>
  <!-- the counter loader plays once per visit; every later page skips it and only fades in -->
  <script>var d=document.documentElement;d.classList.replace("no-js","js");try{if(localStorage.getItem("akbar-lang")==="en")d.lang="en";if(sessionStorage.getItem("akbar-seen"))d.classList.add("seen","loaded")}catch(e){}</script>
